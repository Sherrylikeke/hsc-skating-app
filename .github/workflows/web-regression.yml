name: Web regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm run install:ci
      - name: Check Web types
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Run Web regression suites
        run: npm test
      - run: npm run build
      - name: Verify distributed calendar licenses
        run: node scripts/check-calendar-notice.mjs dist/client
      - name: Test the built Worker with temporary D1
        run: node scripts/check-owner-registration-worker.mjs

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Audit the full Web lockfile including Worker build dependencies
        run: npm audit --package-lock-only

  mobile-browser:
    name: mobile-browser (${{ matrix.devices }})
    strategy:
      fail-fast: false
      matrix:
        devices: [existing, representative]
    env:
      HSC_BROWSER_GROUP: ${{ matrix.devices }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm run install:ci
      - name: Install the device profiles and browser engines
        run: |
          npm install --prefix work/browser-qa --no-save --package-lock=false --ignore-scripts playwright-core@1.64.1
          # Refresh stale apt metadata and retry transient mirror/download failures.
          # Browser assertions below still fail immediately; they are never retried.
          for attempt in 1 2 3; do
            if node work/browser-qa/node_modules/playwright-core/cli.js install --with-deps chromium webkit; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "::warning::Browser dependency install failed (attempt $attempt/3); refreshing package metadata before retry."
            sudo apt-get update
            sleep 5
          done
      - name: Build the production Worker for browser journeys
        run: npm run build
      - name: Check phone navigation, layout and picker interactions
        env:
          HSC_PREVIEW_ORIGIN: http://127.0.0.1:5173
        run: |
          node --import ./scripts/sites-env.mjs ./node_modules/wrangler/bin/wrangler.js dev --config dist/server/wrangler.json --local --persist-to .wrangler/browser-ci --ip 127.0.0.1 --port 5173 --inspector-port 0 > "$RUNNER_TEMP/hsc-preview.log" 2>&1 &
          preview=$!
          trap 'kill "$preview" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 45 --retry-delay 1 --retry-all-errors "$HSC_PREVIEW_ORIGIN/favicon.svg" -o /dev/null || { cat "$RUNNER_TEMP/hsc-preview.log"; exit 1; }
          node scripts/check-device-interactions-browser.mjs
          node scripts/check-event-watch-browser.mjs
          node scripts/check-family-calendar-browser.mjs
          node scripts/check-planning-browser.mjs
          if [ "$HSC_BROWSER_GROUP" = existing ]; then
            HSC_MOBILE_WIDTHS=390 node scripts/check-family-schedule-browser.mjs
          fi
      - name: Save browser journey diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: phone-browser-diagnostics-${{ matrix.devices }}
          path: |
            work/device-interactions/**
            work/event-watch/**
            work/family-calendar/**
            work/planning-browser/**
            work/family-schedule/**
            ${{ runner.temp }}/hsc-preview.log
          if-no-files-found: ignore
